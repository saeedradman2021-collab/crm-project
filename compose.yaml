services:
  db:
    image: postgres:17
    container_name: crm-compose-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      - crm-compose-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped

    mem_limit: 256m
    environment:
      DB_HOST: db
      DB_PASSWORD: saeed@12
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
     build: ./frontend
     restart: unless-stopped
     ports:
       - "3001:3000"
     depends_on:
       - backend
volumes:
  crm-compose-data:
